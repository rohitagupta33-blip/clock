<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>clock made by rohit
    </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="clock">
        
        <div class="hand hour"></div>
        <div class="hand minute"></div>
        <div class="hand second"></div>
        <p class="p1">1</p>
        <p class="p2">2</p>
        <p class="p3">3</p>
        <p class="p4">4</p>
        <p class="p5">5</p>
        <p class="p6">9</p>
        <p class="p7">7</p>
        <p class="p8">8</p>
        <p class="p9">9</p>
        <p class="p10">10</p>
        <p class="p11">11</p>
        <p class="p12">12</p>
        
    </div>
    <script src="script.js"></script>
    
</body>
</html>
